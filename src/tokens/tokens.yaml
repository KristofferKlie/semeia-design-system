# SemeIA Educação - Design Tokens
# Fonte de verdade para cores, tipografia, espaçamentos e mais
# Versão: 1.0.0

metadata:
  name: SemeIA Design System
  version: 1.0.0
  description: Tokens de design para plataforma educacional
  brand: SemeIA Educação
  created_at: 2025-02-03

# =============================================================================
# COLORS - Paleta de cores educacional
# =============================================================================
colors:
  # Brand Colors - Identidade visual SemeIA
  brand:
    primary:
      50: "#E8F4FD"
      100: "#C5E4FA"
      200: "#9ED0F5"
      300: "#77BCF0"
      400: "#50A8EB"
      500: "#2196F3"  # Main - Azul Conhecimento
      600: "#1976D2"
      700: "#1565C0"
      800: "#0D47A1"
      900: "#0A3A8A"

    secondary:
      50: "#E8F5E9"
      100: "#C8E6C9"
      200: "#A5D6A7"
      300: "#81C784"
      400: "#66BB6A"
      500: "#4CAF50"  # Main - Verde Crescimento
      600: "#43A047"
      700: "#388E3C"
      800: "#2E7D32"
      900: "#1B5E20"

    accent:
      50: "#FFF3E0"
      100: "#FFE0B2"
      200: "#FFCC80"
      300: "#FFB74D"
      400: "#FFA726"
      500: "#FF9800"  # Main - Laranja Energia
      600: "#FB8C00"
      700: "#F57C00"
      800: "#EF6C00"
      900: "#E65100"

  # Semantic Colors - Feedback e estados
  semantic:
    success:
      light: "#E8F5E9"
      main: "#4CAF50"
      dark: "#2E7D32"
      foreground: "#FFFFFF"

    warning:
      light: "#FFF8E1"
      main: "#FFC107"
      dark: "#F57F17"
      foreground: "#1A1A1A"

    error:
      light: "#FFEBEE"
      main: "#F44336"
      dark: "#C62828"
      foreground: "#FFFFFF"

    info:
      light: "#E3F2FD"
      main: "#2196F3"
      dark: "#1565C0"
      foreground: "#FFFFFF"

  # Neutral Colors - Textos e backgrounds
  neutral:
    white: "#FFFFFF"
    black: "#000000"

    gray:
      50: "#FAFAFA"
      100: "#F5F5F5"
      200: "#EEEEEE"
      300: "#E0E0E0"
      400: "#BDBDBD"
      500: "#9E9E9E"
      600: "#757575"
      700: "#616161"
      800: "#424242"
      900: "#212121"

  # Educational Context Colors - Específicas para contexto educacional
  educational:
    # Níveis de dificuldade
    beginner: "#81C784"      # Verde claro - Iniciante
    intermediate: "#FFB74D"  # Laranja claro - Intermediário
    advanced: "#EF5350"      # Vermelho claro - Avançado

    # Tipos de conteúdo
    video: "#F44336"         # Vermelho (YouTube-like)
    reading: "#2196F3"       # Azul
    exercise: "#FF9800"      # Laranja
    quiz: "#9C27B0"          # Roxo
    project: "#4CAF50"       # Verde

    # Gamificação
    xp: "#FFD700"            # Dourado - Experiência
    badge: "#9C27B0"         # Roxo - Conquistas
    streak: "#FF5722"        # Laranja escuro - Sequência

# =============================================================================
# TYPOGRAPHY - Sistema tipográfico
# =============================================================================
typography:
  fonts:
    sans: "Inter, system-ui, -apple-system, sans-serif"
    mono: "JetBrains Mono, Fira Code, monospace"
    heading: "Inter, system-ui, sans-serif"

  # Font Sizes (usando escala modular 1.25)
  sizes:
    xs: "0.75rem"      # 12px
    sm: "0.875rem"     # 14px
    base: "1rem"       # 16px
    lg: "1.125rem"     # 18px
    xl: "1.25rem"      # 20px
    2xl: "1.5rem"      # 24px
    3xl: "1.875rem"    # 30px
    4xl: "2.25rem"     # 36px
    5xl: "3rem"        # 48px
    6xl: "3.75rem"     # 60px

  # Font Weights
  weights:
    light: 300
    normal: 400
    medium: 500
    semibold: 600
    bold: 700
    extrabold: 800

  # Line Heights
  lineHeights:
    none: 1
    tight: 1.25
    snug: 1.375
    normal: 1.5
    relaxed: 1.625
    loose: 2

  # Letter Spacing
  letterSpacing:
    tighter: "-0.05em"
    tight: "-0.025em"
    normal: "0"
    wide: "0.025em"
    wider: "0.05em"
    widest: "0.1em"

# =============================================================================
# SPACING - Sistema de espaçamento (base 4px)
# =============================================================================
spacing:
  0: "0"
  px: "1px"
  0.5: "0.125rem"   # 2px
  1: "0.25rem"      # 4px
  1.5: "0.375rem"   # 6px
  2: "0.5rem"       # 8px
  2.5: "0.625rem"   # 10px
  3: "0.75rem"      # 12px
  3.5: "0.875rem"   # 14px
  4: "1rem"         # 16px
  5: "1.25rem"      # 20px
  6: "1.5rem"       # 24px
  7: "1.75rem"      # 28px
  8: "2rem"         # 32px
  9: "2.25rem"      # 36px
  10: "2.5rem"      # 40px
  11: "2.75rem"     # 44px
  12: "3rem"        # 48px
  14: "3.5rem"      # 56px
  16: "4rem"        # 64px
  20: "5rem"        # 80px
  24: "6rem"        # 96px
  28: "7rem"        # 112px
  32: "8rem"        # 128px
  36: "9rem"        # 144px
  40: "10rem"       # 160px

# =============================================================================
# BORDERS - Bordas e raios
# =============================================================================
borders:
  radius:
    none: "0"
    sm: "0.125rem"    # 2px
    default: "0.25rem" # 4px
    md: "0.375rem"    # 6px
    lg: "0.5rem"      # 8px
    xl: "0.75rem"     # 12px
    2xl: "1rem"       # 16px
    3xl: "1.5rem"     # 24px
    full: "9999px"

  width:
    0: "0"
    1: "1px"
    2: "2px"
    4: "4px"
    8: "8px"

# =============================================================================
# SHADOWS - Sistema de sombras
# =============================================================================
shadows:
  sm: "0 1px 2px 0 rgb(0 0 0 / 0.05)"
  default: "0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)"
  md: "0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)"
  lg: "0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)"
  xl: "0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)"
  2xl: "0 25px 50px -12px rgb(0 0 0 / 0.25)"
  inner: "inset 0 2px 4px 0 rgb(0 0 0 / 0.05)"
  none: "none"

  # Sombras coloridas para cards interativos
  colored:
    primary: "0 4px 14px 0 rgb(33 150 243 / 0.25)"
    success: "0 4px 14px 0 rgb(76 175 80 / 0.25)"
    warning: "0 4px 14px 0 rgb(255 152 0 / 0.25)"
    error: "0 4px 14px 0 rgb(244 67 54 / 0.25)"

# =============================================================================
# BREAKPOINTS - Responsividade
# =============================================================================
breakpoints:
  xs: "320px"
  sm: "640px"
  md: "768px"
  lg: "1024px"
  xl: "1280px"
  2xl: "1536px"

# =============================================================================
# Z-INDEX - Camadas
# =============================================================================
zIndex:
  hide: -1
  auto: "auto"
  base: 0
  dropdown: 1000
  sticky: 1100
  fixed: 1200
  overlay: 1300
  modal: 1400
  popover: 1500
  tooltip: 1600
  toast: 1700

# =============================================================================
# TRANSITIONS - Animações
# =============================================================================
transitions:
  duration:
    fast: "150ms"
    default: "200ms"
    slow: "300ms"
    slower: "500ms"

  timing:
    ease: "ease"
    easeIn: "ease-in"
    easeOut: "ease-out"
    easeInOut: "ease-in-out"
    linear: "linear"
