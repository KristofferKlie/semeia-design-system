# SemeIA Educação - Design Tokens
# Source of Truth: Extracted from https://semeiaeducacao.ia.br/ (February 2026)
# CSS file: /_next/static/chunks/e386f4a6abdbbd93.css
# Version: 2.0.0

metadata:
  name: SemeIA Design System
  version: 3.0.0
  description: Design tokens para plataforma educacional SemeIA
  brand: SemeIA Educação
  updated_at: 2026-02-20
  source_url: https://semeiaeducacao.ia.br/
  mode: dark  # Site principal é dark mode
  font: Montserrat

# =============================================================================
# COLORS - Paleta de cores oficial SemeIA
# Extraídas diretamente do CSS da produção
# =============================================================================
colors:
  # ---------------------------------------------------------------------------
  # BRAND COLORS - Core identity
  # ---------------------------------------------------------------------------
  brand:
    # Verde SemeIA - cor principal (botões, CTAs, destaques)
    green:
      main: "#3D8B40"      # brand-500 - Botões primários, links ativos, ícones
      hover: "#357a38"     # brand-600 - Estado hover de botões
      deep: "#2e7d32"      # Versão ainda mais escura (Tailwind green-800)
      light: "#4ade80"     # Números, textos de destaque em dark mode (Tailwind green-400)
      lighter: "#5a9a5c"   # brand-400 - tom intermediário
      glow: "#3D8B4033"    # Verde com 20% opacidade - glow radial
      glow_subtle: "#3D8B400d"  # Verde com 5% opacidade - fundo hero

    # Azul Petróleo SemeIA - usado como secondary/info
    blue:
      main: "#2d4a5e"      # Azul petróleo principal
      light: "#5e8b9e"     # Tom mais claro

    # Dourado/Âmbar SemeIA - accent/warning
    gold:
      main: "#e9a83a"      # Dourado principal
      amber: "#fbbf24"     # Âmbar claro (Tailwind amber-400) - textos accent

    # Creme/Bege - para light mode
    cream: "#f7f5f0"

  # ---------------------------------------------------------------------------
  # DARK MODE BACKGROUNDS - Tons de fundo escuro
  # ---------------------------------------------------------------------------
  backgrounds:
    primary: "#050505"    # bg-primary - Fundo principal do site (quase preto)
    secondary: "#0f0f0f"  # bg-secondary - Seções alternadas
    tertiary: "#1a1a1a"   # bg-tertiary - Cards, containers
    card: "#171717"       # Cards em landing pages (nota: producao usa #171717)
    # LP classes agora alinhadas com produção:
    lp_primary: "#050505"    # lp-bg-primary (alinhado com produção)
    lp_secondary: "#0F0F0F"  # lp-bg-secondary (alinhado com produção)
    lp_tertiary: "#1A1A1A"   # lp-bg-tertiary (novo)
    lp_card: "#171717"       # lp-bg-card

  # ---------------------------------------------------------------------------
  # NEUTRAL SCALE - Escala completa de cinzas
  # ---------------------------------------------------------------------------
  neutral:
    50:  "#FAFAFA"
    100: "#F5F5F5"
    200: "#E5E5E5"
    300: "#D4D4D4"
    400: "#A3A3A3"
    500: "#737373"
    600: "#525252"
    700: "#262626"
    800: "#0F0F0F"
    900: "#050505"

  # ---------------------------------------------------------------------------
  # TEXT COLORS
  # ---------------------------------------------------------------------------
  text:
    primary: "#FFFFFF"     # Branco - títulos, texto principal
    secondary: "#A3A3A3"   # neutral-400 - texto secundário/body
    tertiary: "#737373"    # neutral-500 - texto terciário/captions
    muted: "#525252"       # neutral-600 - texto muito apagado
    subtle: "#D4D4D4"      # neutral-300 - levemente apagado

  # ---------------------------------------------------------------------------
  # BORDER COLORS
  # ---------------------------------------------------------------------------
  borders:
    subtle: "#262626"              # border-subtle - borda padrão
    white_10: "rgba(255,255,255,0.1)"  # Bordas de cards em dark mode
    white_05: "rgba(255,255,255,0.05)" # Bordas muito sutis
    brand_30: "rgba(61,139,64,0.3)"   # Borda verde hover
    brand_50: "rgba(61,139,64,0.5)"   # Borda verde hover forte

  # ---------------------------------------------------------------------------
  # SEMANTIC COLORS - Estados e feedback
  # ---------------------------------------------------------------------------
  semantic:
    success:
      main: "#3D8B40"        # Verde (mesmo que brand)
      light: "#E8F5E9"       # Fundo verde claro (light mode)
      foreground: "#FFFFFF"

    warning:
      main: "#E9A83A"        # Dourado/Âmbar
      light: "#FEF7E6"       # Fundo âmbar claro
      foreground: "#1a1a1a"  # Texto escuro sobre fundo âmbar

    error:
      main: "#C25550"        # Vermelho escuro
      light: "#FAEAE9"       # Fundo vermelho claro
      tailwind: "#EF4444"    # red-500 (usado em formulários)
      foreground: "#FFFFFF"

    info:
      main: "#2D4A5E"        # Azul petróleo
      light: "#E3EDF3"       # Fundo azul claro

  # ---------------------------------------------------------------------------
  # AGENT COLORS - Cores dos agentes IA SemeIA
  # ---------------------------------------------------------------------------
  agents:
    leonardo:
      main: "#3D8B40"        # Verde
      bg: "#E8F5E9"

    mafalda:
      main: "#2D4A5E"        # Azul petróleo
      bg: "#E3EDF3"

    mario:
      main: "#E9A83A"        # Dourado
      bg: "#FEF7E6"

    martha:
      main: "#5E8B9E"        # Azul claro
      bg: "#E6F0F5"

    bento:
      main: "#8B6B3D"        # Marrom/terra
      bg: "#F5EFE6"

    nina:
      main: "#9E5E6B"        # Rosa
      bg: "#F5E6E9"

  # ---------------------------------------------------------------------------
  # WHATSAPP
  # ---------------------------------------------------------------------------
  whatsapp: "#25D366"         # Verde WhatsApp oficial

  # ---------------------------------------------------------------------------
  # GRADIENTS
  # ---------------------------------------------------------------------------
  gradients:
    text_green:
      css: "linear-gradient(135deg, #5a9a5c 0%, #3d8b40 50%, #2e7d32 100%)"
      use: "Texto com gradiente verde (.text-gradient)"

    text_white_to_green:
      css: "linear-gradient(90deg, #ffffff 0%, #86efac 50%, #4ade80 100%)"
      use: "Hero text highlight (.lp-text-gradient)"

    hero_radial:
      css: "radial-gradient(circle, #3d8b4026 0%, #3d8b400d 40%, transparent 70%)"
      use: "Glow radial no hero (.hero-bg-glow)"

    hero_ellipse:
      css: "radial-gradient(ellipse at center, rgba(61, 139, 64, 0.15) 0%, transparent 70%)"
      use: "Pseudo-elemento ::before no .lp-hero"

    divider_green:
      css: "linear-gradient(90deg, #3D8B40, #4ade80)"
      use: "Divisores horizontais (.lp-divider)"

    divider_accent:
      css: "linear-gradient(90deg, #E8941A, #fbbf24)"
      use: "Divisores accent (.lp-divider-accent)"

    btn_hover_shadow:
      css: "0 8px 25px -5px rgba(61, 139, 64, 0.4)"
      use: "Sombra hover do botão primário"

# =============================================================================
# TYPOGRAPHY - Sistema tipográfico oficial
# =============================================================================
typography:
  fonts:
    primary: "Montserrat, system-ui, -apple-system, sans-serif"
    fallback: "Montserrat Fallback"  # Arial com ajustes métricos
    # Fallback metrics:
    #   ascent-override: 85.79%
    #   descent-override: 22.25%
    #   size-adjust: 112.83%

  # Font Weights disponíveis no @font-face
  weights:
    light: 300
    normal: 400
    medium: 500
    semibold: 600
    bold: 700

  # Escala de tamanhos (Tailwind padrão)
  sizes:
    xs:   { rem: "0.75rem",  px: "12px", line_height: "1rem" }
    sm:   { rem: "0.875rem", px: "14px", line_height: "1.25rem" }
    base: { rem: "1rem",     px: "16px", line_height: "1.5rem" }
    lg:   { rem: "1.125rem", px: "18px", line_height: "1.75rem" }
    xl:   { rem: "1.25rem",  px: "20px", line_height: "1.75rem" }
    2xl:  { rem: "1.5rem",   px: "24px", line_height: "2rem" }
    3xl:  { rem: "1.875rem", px: "30px", line_height: "2.25rem" }
    4xl:  { rem: "2.25rem",  px: "36px", line_height: "2.5rem" }
    5xl:  { rem: "3rem",     px: "48px", line_height: "1" }
    6xl:  { rem: "3.75rem",  px: "60px", line_height: "1" }

  # Heading hierarchy (Landing Page dark mode)
  headings:
    h1:
      classes: "text-4xl md:text-5xl lg:text-6xl font-bold text-white leading-tight"
      sizes: { mobile: "2.25rem", tablet: "3rem", desktop: "3.75rem" }
      weight: 700
      color: "#FFFFFF"
      line_height: 1.25

    h2:
      classes: "text-3xl md:text-4xl font-bold text-white"
      sizes: { mobile: "1.875rem", desktop: "2.25rem" }
      weight: 700
      color: "#FFFFFF"

    h3:
      classes: "text-xl font-semibold text-white"
      size: "1.25rem"
      weight: 600
      color: "#FFFFFF"

  # Body text
  body:
    large:
      classes: "text-lg md:text-xl"
      color: "#A3A3A3"
      sizes: { mobile: "1.125rem", desktop: "1.25rem" }

    normal:
      classes: "text-base"
      color: "#A3A3A3"
      size: "1rem"

    small:
      classes: "text-sm"
      color: "#737373"
      size: "0.875rem"

  # Special text styles
  special:
    badge:
      classes: "text-sm font-semibold uppercase tracking-wider"
      letter_spacing: "0.05em"

    nav_link:
      classes: "text-sm font-medium text-white hover:text-brand-500"

    stat_number:
      classes: "text-4xl md:text-5xl font-bold"
      color: "#4ade80"

  # Letter spacing
  letter_spacing:
    normal: "0"
    wider: "0.05em"    # tracking-wider
    widest: "0.1em"    # tracking-widest

  # Line heights
  line_heights:
    tight: 1.25      # leading-tight (headings)
    normal: 1.5      # default body
    relaxed: 1.625

# =============================================================================
# SPACING - Sistema de espaçamento
# =============================================================================
spacing:
  # Seções
  section:
    padding_y: "6rem"      # py-24 = 96px
    padding_x: "1.5rem"    # px-6 = 24px
    padding_y_sm: "4rem"   # py-16 = 64px

  # Container
  container:
    max_width: "80rem"     # max-w-7xl = 1280px
    padding_x: "1.5rem"   # px-6

  # Header
  header:
    height: "5rem"         # h-20 = 80px
    logo_height: "4rem"    # h-16 = 64px

  # Cards
  cards:
    padding: "2rem"        # p-8 = 32px
    padding_sm: "1.5rem"   # p-6 = 24px
    gap: "2rem"            # gap-8

  # Buttons
  buttons:
    lg: { px: "2.5rem", py: "1rem" }    # px-10 py-4
    md: { px: "1.5rem", py: "0.75rem" } # px-6 py-3
    sm: { px: "1rem",   py: "0.5rem" }  # px-4 py-2

  # Common margins
  mb:
    sm: "0.5rem"    # mb-2
    md: "0.75rem"   # mb-3
    lg: "1rem"      # mb-4
    xl: "1.5rem"    # mb-6
    2xl: "2rem"     # mb-8
    3xl: "2.5rem"   # mb-10
    4xl: "3rem"     # mb-12
    5xl: "4rem"     # mb-16

  # Gaps
  gaps:
    sm: "0.75rem"   # gap-3
    md: "1rem"      # gap-4
    lg: "1.5rem"    # gap-6
    xl: "2rem"      # gap-8
    2xl: "3rem"     # gap-12

# =============================================================================
# BORDERS - Raios e espessuras
# =============================================================================
borders:
  radius:
    none: "0"
    sm: "0.375rem"   # 6px  - rounded-md (inputs)
    md: "0.5rem"     # 8px  - rounded-lg (botões)
    lg: "0.5rem"     # 8px  - rounded-lg
    xl: "0.75rem"    # 12px - rounded-xl (cards)
    2xl: "1rem"      # 16px - rounded-2xl (form containers)
    3xl: "1.5rem"    # 24px
    full: "9999px"   # rounded-full (badges, avatar)

  width:
    default: "1px"
    medium: "2px"

  colors:
    default: "rgba(255,255,255,0.1)"   # Cards dark mode
    hover: "rgba(61,139,64,0.5)"       # Hover verde
    header: "rgba(255,255,255,0.0784)" # Header (1px branco translúcido)
    footer: "rgba(255,255,255,0.1)"

# =============================================================================
# SHADOWS - Sistema de sombras
# =============================================================================
shadows:
  sm: "0 1px 2px 0 rgb(0 0 0 / 0.05)"
  default: "0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)"
  md: "0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)"
  lg: "0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)"
  xl: "0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)"
  2xl: "0 25px 50px -12px rgb(0 0 0 / 0.25)"
  inner: "inset 0 2px 4px 0 rgb(0 0 0 / 0.05)"

  # Sombras com cor (dark mode)
  colored:
    brand: "0 8px 25px -5px rgba(61, 139, 64, 0.4)"        # Botão primário hover
    brand_card: "0 20px 40px -15px rgba(61, 139, 64, 0.2)" # Card hover
    brand_glow: "0 4px 14px 0 rgba(61, 139, 64, 0.25)"     # Glow sutil
    accent: "0 8px 25px -5px rgba(232, 148, 26, 0.4)"      # Botão accent hover
    whatsapp: "0 4px 15px rgba(37, 211, 102, 0.4)"         # WhatsApp button
    whatsapp_hover: "0 8px 25px rgba(37, 211, 102, 0.5)"
    card_dark: "0 25px 50px -12px rgba(0, 0, 0, 0.5)"      # Success card

# =============================================================================
# COMPONENTS - Especificações de componentes
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # HEADER / NAVIGATION
  # ---------------------------------------------------------------------------
  header:
    height: "5rem"           # h-20 = 80px
    background: "rgba(10, 10, 10, 0.8)"  # lp-header usa #0A0A0A/80
    background_legacy: "rgba(5, 5, 5, 0.8)"  # glass-header usa #050505cc
    blur: "blur(20px)"       # backdrop-filter
    blur_legacy: "blur(10px)"
    border_bottom: "1px solid rgba(255, 255, 255, 0.0784)"
    z_index: 1000
    position: "fixed"
    nav_link_color: "#FFFFFF"
    nav_link_hover: "#3D8B40"
    nav_link_size: "0.875rem"   # text-sm
    nav_link_weight: 500        # font-medium
    logo_height: "4rem"         # h-16

  # ---------------------------------------------------------------------------
  # HERO SECTION
  # ---------------------------------------------------------------------------
  hero:
    min_height: "100vh"      # min-h-screen
    padding_top: "5rem"      # pt-20 (compensa o header fixo)
    background: "#0A0A0A"
    glow_element:
      width: "900px"
      height: "500px"
      gradient: "radial-gradient(ellipse at center, rgba(61, 139, 64, 0.15) 0%, transparent 70%)"
      position: "absolute top-0 left-50% transform -translateX-50%"
    badge:
      background: "rgba(61, 139, 64, 0.2)"
      color: "#4ade80"
      border: "1px solid rgba(61, 139, 64, 0.3)"
      padding: "0.375rem 1rem"  # py-1.5 px-4
      border_radius: "9999px"
      font_size: "0.875rem"
      font_weight: 500

  # ---------------------------------------------------------------------------
  # BUTTONS
  # ---------------------------------------------------------------------------
  buttons:
    primary:
      background: "#3D8B40"
      color: "#FFFFFF"
      hover_bg: "#357a38"
      hover_transform: "translateY(-2px)"
      hover_shadow: "0 8px 25px -5px rgba(61, 139, 64, 0.4)"
      border_radius: "0.5rem"   # rounded-lg
      font_weight: 600          # font-semibold
      transition: "all 200ms"
      sizes:
        lg: { padding: "1rem 2.5rem", font_size: "1.125rem" }   # px-10 py-4 text-lg
        md: { padding: "0.75rem 1.5rem", font_size: "1rem" }    # px-6 py-3
        sm: { padding: "0.5rem 1rem", font_size: "0.875rem" }   # px-4 py-2

    outline:
      background: "transparent"
      color: "#4ade80"
      border: "2px solid #3D8B40"
      hover_bg: "#3D8B40"
      hover_color: "#FFFFFF"
      border_radius: "0.5rem"

    accent:
      background: "#E8941A"
      color: "#1a1a1a"
      hover_bg: "#d4850f"
      hover_shadow: "0 8px 25px -5px rgba(232, 148, 26, 0.4)"
      hover_transform: "translateY(-2px)"

  # ---------------------------------------------------------------------------
  # CARDS
  # ---------------------------------------------------------------------------
  cards:
    default:
      background: "#171717"
      border: "1px solid rgba(255, 255, 255, 0.1)"
      border_radius: "0.75rem"  # rounded-xl
      padding: "2rem"           # p-8
      hover_transform: "translateY(-4px)"
      hover_border: "rgba(61, 139, 64, 0.5)"
      hover_shadow: "0 20px 40px -15px rgba(61, 139, 64, 0.2)"
      transition: "all 300ms"

    small:
      background: "#171717"
      border: "1px solid rgba(255, 255, 255, 0.1)"
      border_radius: "0.75rem"
      padding: "1.5rem"         # p-6
      hover_transform: "translateY(-2px)"
      hover_border: "rgba(61, 139, 64, 0.3)"

    feature:  # Cards da seção soluções/features
      text_align: "center"
      icon_container:
        size: "3rem"           # w-12 h-12
        border_radius: "0.75rem"
        background: "rgba(61, 139, 64, 0.1)"
        color: "#4ade80"

  # ---------------------------------------------------------------------------
  # BADGES
  # ---------------------------------------------------------------------------
  badges:
    brand:
      background: "rgba(61, 139, 64, 0.2)"
      color: "#4ade80"
      border: "1px solid rgba(61, 139, 64, 0.3)"
      padding: "0.375rem 1rem"
      border_radius: "9999px"
      font_size: "0.875rem"
      font_weight: 500

    accent:
      background: "rgba(232, 148, 26, 0.2)"
      color: "#fbbf24"
      border: "1px solid rgba(232, 148, 26, 0.3)"
      padding: "0.375rem 1rem"
      border_radius: "9999px"

    white:
      background: "rgba(255, 255, 255, 0.2)"
      color: "#FFFFFF"
      padding: "0.5rem 1rem"
      border_radius: "9999px"

  # ---------------------------------------------------------------------------
  # ICONS
  # ---------------------------------------------------------------------------
  icons:
    default:
      size: "3rem"            # w-12 h-12
      border_radius: "0.75rem"
      background: "rgba(61, 139, 64, 0.1)"
      color: "#4ade80"

    large:
      size: "4rem"            # w-16 h-16
      border_radius: "0.75rem"
      background: "rgba(61, 139, 64, 0.1)"
      color: "#4ade80"

    accent:
      size: "3rem"
      border_radius: "0.75rem"
      background: "rgba(232, 148, 26, 0.1)"
      color: "#fbbf24"

  # ---------------------------------------------------------------------------
  # DIVIDERS
  # ---------------------------------------------------------------------------
  dividers:
    brand:
      height: "4px"           # h-1
      width: "5rem"           # w-20
      border_radius: "9999px"
      gradient: "linear-gradient(90deg, #3D8B40, #4ade80)"

    accent:
      height: "4px"
      width: "5rem"
      border_radius: "9999px"
      gradient: "linear-gradient(90deg, #E8941A, #fbbf24)"

  # ---------------------------------------------------------------------------
  # FORMS / INPUTS
  # ---------------------------------------------------------------------------
  forms:
    input:
      background: "#171717"
      border: "1px solid rgba(255, 255, 255, 0.1)"
      color: "#FFFFFF"
      placeholder_color: "rgba(255, 255, 255, 0.4)"
      border_radius: "0.5rem"  # rounded-lg
      padding: "0.75rem 1rem"  # py-3 px-4
      focus_border: "#3D8B40"
      focus_shadow: "0 0 0 3px rgba(61, 139, 64, 0.2)"

    container:
      background: "#171717"
      border: "1px solid rgba(255, 255, 255, 0.1)"
      border_radius: "1rem"   # rounded-2xl
      padding: "1.5rem"       # p-6 (md: p-8)

  # ---------------------------------------------------------------------------
  # FOOTER
  # ---------------------------------------------------------------------------
  footer:
    background: "#0A0A0A"
    border_top: "1px solid rgba(255, 255, 255, 0.1)"
    padding_y: "3rem"         # py-12
    link_color: "#A3A3A3"     # neutral-400
    link_hover: "#FFFFFF"
    text_color: "#737373"     # neutral-500

  # ---------------------------------------------------------------------------
  # WHATSAPP FLOAT BUTTON
  # ---------------------------------------------------------------------------
  whatsapp:
    background: "#25D366"
    color: "#FFFFFF"
    size: "3.75rem"           # w-15 h-15 (60px)
    size_lp: "3.5rem"         # w-14 h-14 (56px) - versão landing
    border_radius: "9999px"
    z_index: 2000
    position: { bottom: "1.5rem", right: "1.5rem" }
    shadow: "0 4px 15px rgba(37, 211, 102, 0.4)"
    hover_transform: "scale(1.1)"
    hover_shadow: "0 8px 25px rgba(37, 211, 102, 0.5)"

  # ---------------------------------------------------------------------------
  # STATS SECTION
  # ---------------------------------------------------------------------------
  stats:
    number:
      color: "#4ade80"        # Verde claro
      sizes: "text-4xl md:text-5xl font-bold"
    label:
      color: "rgba(255, 255, 255, 0.7)"
      size: "text-sm"

  # ---------------------------------------------------------------------------
  # FAQ / ACCORDION
  # ---------------------------------------------------------------------------
  faq:
    container:
      background: "#171717"
      border: "1px solid rgba(255, 255, 255, 0.1)"
      border_radius: "0.75rem"
    button:
      color: "#FFFFFF"
      hover_bg: "rgba(255, 255, 255, 0.05)"
      padding: "1.5rem"
    content:
      color: "#A3A3A3"
      padding: "0 1.5rem 1.5rem"

# =============================================================================
# ANIMATIONS - Keyframes e transições
# =============================================================================
animations:
  keyframes:
    fadeIn:
      from: { opacity: 0, transform: "translateY(20px)" }
      to: { opacity: 1, transform: "translateY(0)" }
      duration: "0.8s"
      timing: "ease-out"
      class: "animate-fade-in"

    lpFadeIn:
      from: { opacity: 0 }
      to: { opacity: 1 }
      duration: "0.6s"
      timing: "ease-out"
      class: "lp-fade-in"

    lpSlideUp:
      from: { opacity: 0, transform: "translateY(20px)" }
      to: { opacity: 1, transform: "translateY(0)" }
      duration: "0.6s"
      timing: "ease-out"
      class: "lp-slide-up"

  transitions:
    fast: "150ms cubic-bezier(0.4, 0, 0.2, 1)"
    default: "200ms cubic-bezier(0.4, 0, 0.2, 1)"
    slow: "300ms"

# =============================================================================
# Z-INDEX - Camadas
# =============================================================================
z_index:
  behind: -1          # hero-bg-glow
  base: 0
  header: 1000        # glass-header / .lp-header
  whatsapp: 2000      # botão flutuante

# =============================================================================
# BREAKPOINTS - Responsividade
# =============================================================================
breakpoints:
  sm: "640px"
  md: "768px"
  lg: "1024px"
  xl: "1280px"
  2xl: "1400px"       # container max-width

# =============================================================================
# LAYOUT PATTERNS - Grids usados no site
# =============================================================================
layout:
  grids:
    features: "grid md:grid-cols-2 lg:grid-cols-3 gap-8"
    stats: "grid grid-cols-2 md:grid-cols-4 gap-8"
    two_col: "grid md:grid-cols-2 gap-12"

  container: "max-w-7xl mx-auto px-6"

# =============================================================================
# VISUAL IDENTITY - Resumo da identidade visual
# =============================================================================
visual_identity:
  mode: "dark"
  aesthetic: "Minimalista escuro premium com accent verde"
  description: >
    Site dark mode com fundos próximos ao preto (#050505 a #1a1a1a).
    Texto principal branco, texto secundário cinza neutro (#A3A3A3).
    Cor de destaque: Verde SemeIA (#3D8B40) para botões, CTAs, ícones, números.
    Verde claro (#4ade80) para números de estatísticas e textos de destaque.
    Glassmorphism no header (backdrop-filter: blur).
    Cards com borda sutil rgba(255,255,255,0.1) que acende em verde no hover.
    Glow radial verde no hero como elemento de profundidade.
    Fonte: Montserrat em todos os pesos.

  do:
    - "Usar verde (#3D8B40) em botões primários, links ativos, ícones, bordas hover"
    - "Usar verde claro (#4ade80) em números de estatísticas e texto de destaque"
    - "Usar fundos escuros (#050505, #0f0f0f, #1a1a1a) para backgrounds"
    - "Usar borda rgba(255,255,255,0.1) para cards em dark mode"
    - "Glassmorphism no header fixo"
    - "Radial glow verde no hero"

  dont:
    - "NÃO usar laranja (#E8941A) em elementos principais - apenas accent especial"
    - "NÃO usar fundo verde em seções inteiras (lp-bg-brand PROIBIDO)"
    - "NÃO usar azul como cor primária (é secondary/info)"
    - "NÃO usar fundos brancos ou claros - site é 100% dark mode"
